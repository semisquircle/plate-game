<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Plate Game - Search</title>

	<link rel="shortcut icon" type="image/x-icon" href="img/favicon/favicon.png">
	<link rel="icon" sizes="32x32" href="img/favicon/favicon.png">
	<link rel="apple-touch-icon" href="img/favicon/favicon-300.png">

	<script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.5.1.min.js"></script>
	<script src="https://kit.fontawesome.com/5978d27576.js" crossorigin="anonymous"></script>
	<script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>

	<link rel="stylesheet" href="fonts/fonts.css">
	<link rel="stylesheet" href="css/variables.css">
	<link rel="stylesheet" href="css/main.css">
	<link rel="stylesheet" href="css/search.css">
	<link rel="stylesheet" media="screen and (max-width: 600px)" href="css/mobile.css">
</head>

<body>
	<div class="screen current-screen" id="search-screen">
		<!-- Letter input -->
		<div id="letter-input-wrapper">
			<div id="letter-input-placeholder">
				Search a<br>
				three-letter<br>
				combo...
			</div>

			<div id="letter-input-shadow"></div>
			<input id="letter-input" type="text" maxlength="3" autocomplete="off" autofocus>
		</div>


		<!-- Filtered -->
		<div class="filtered-container">
			<div class="filtered-box immediate-box">
				<div class="word-count">These letters correspond with <span class="actual actual-count">0</span> words:</div>
				<div class="sample-word-list"></div>
				<div class="btn special-hover hide-btn" id="show-all-btn">
					<i class="fa-solid fa-bars-staggered"></i>
					Show All
				</div>
			</div>
	
			<div class="properties-container">
				<div class="filtered-box">
					<span>Longest Word:</span>
					<span class="actual actual-longest">???</span>
				</div>
	
				<div class="filtered-box middlest-box">
					<span>Middlest Word:</span>
					<span class="actual actual-middlest">???</span>
				</div>
	
				<div class="filtered-box">
					<span>Shortest Word:</span>
					<span class="actual actual-shortest">???</span>
				</div>
			</div>
		</div>

		<a class="circle-btn special-hover" id="game-circle-btn" href="./"><i class="fas fa-gamepad"></i></a>
	</div>


	<!-- All words -->
	<div class="screen" id="all-words-screen">
		<div class="circle-btn close-all-btn special-hover"><i class="fas fa-xmark"></i></div>

		<div class="all-wrapper">
			<div class="sort-container">
				<input type="radio" name="sort" id="alpha-sort" autocomplete="off" checked>
				<label class="btn" for="alpha-sort"><i class="fas fa-sort-alpha-down"></i>Sort Alphabetically</label>
	
				<input type="radio" name="sort" id="length-sort" autocomplete="off">
				<label class="btn special-hover" for="length-sort"><i class="fas fa-ruler"></i>Sort by Word Length</label>
			</div>

			<div class="all-word-list"></div>
		</div>
	</div>


	<script src="js/words.js"></script>
	<script src="js/main.js"></script>
	<script src="js/search.js"></script>
</body>

</html>
